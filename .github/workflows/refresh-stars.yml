name: Refresh Plugin Stars

on:
  schedule:
    # Every 2 days at 03:20 UTC (11:20 Beijing).
    # GitHub's day-of-month */2 is close to every-48h but not strict across month boundaries.
    - cron: "20 3 */2 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh star counts from GitHub GraphQL
        run: npm run refresh-stars
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate content
        run: npm run generate-content

      - name: Validate content
        run: npm run validate-content

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.check.outputs.changed == 'true'
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add data/sources/ scripts/ package.json package-lock.json content/ docs/ README.md README.zh-CN.md
          git diff --cached --quiet || git commit -m "chore: refresh plugin stars"
          git push